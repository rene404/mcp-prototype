version: "3.9"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mcp_docs:
    build:
      context: .
    command: python mcp-docs/doc_search.py
    depends_on:
      - redis
    environment:
      - MCP_SERVER_NAME=DocumentSearchServer
    ports:
      - "8003:8000"  # 👈 Exposed as localhost:8003

  mcp_financial:
    build:
      context: .
    command: python mcp-financial/financial_history.py
    depends_on:
      - redis
    environment:
      - MCP_SERVER_NAME=FinancialHistoryServer
    ports:
      - "8001:8000"  # 👈 Exposed as localhost:8001

  mcp_stock:
    build:
      context: .
    command: python mcp-stock/live_stock.py
    depends_on:
      - redis
    environment:
      - MCP_SERVER_NAME=LiveStockServer
    ports:
      - "8002:8000"  # 👈 Exposed as localhost:8002
